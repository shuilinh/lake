name: CF VLESS node (US exit)

on:
  workflow_dispatch: {}

concurrency:
  group: cf-node
  cancel-in-progress: false

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Fetch binaries
        run: |
          XRAY_URL=$(curl -fsSL "https://api.github.com/repos/XTLS/Xray-core/releases/latest" | python3 -c "
          import sys, json, re
          d = json.load(sys.stdin)
          urls = [a['browser_download_url'] for a in d['assets']]
          match = [u for u in urls if u.endswith('Xray-linux-64.zip')] or [u for u in urls if re.search(r'Xray-linux-64', u)]
          print(match[0])
          ")
          echo "Using Xray: $XRAY_URL"
          curl -fsSL -o /tmp/xray.zip "$XRAY_URL"
          curl -fsSL -o /tmp/cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x /tmp/cloudflared
          mkdir -p /tmp/xray
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/xray.zip').extractall('/tmp/xray')"
          chmod +x /tmp/xray/xray

      - name: Run node (up to 6h)
        run: |
          set -e
          UUID=06e75b3e-3935-4b9e-bc5e-718e5c485d16
          cat > /tmp/xray/config.json <<EOF
          {
            "log": {"level": "warning"},
            "inbounds": [{
              "listen": "127.0.0.1",
              "port": 10086,
              "protocol": "vless",
              "settings": {"clients": [{"id": "$UUID", "flow": ""}], "decryption": "none"},
              "streamSettings": {"network": "ws", "wsSettings": {"path": "/cfws"}}
            }]
          }
          EOF
          /tmp/xray/xray version
          /tmp/xray/xray run -c /tmp/xray/config.json > /tmp/xray.log 2>&1 &
          XRAY_PID=$!
          sleep 2
          if ! kill -0 "$XRAY_PID" 2>/dev/null; then
            echo "XRAY FAILED TO START:"; cat /tmp/xray.log; exit 1
          fi
          /tmp/cloudflared tunnel --url http://127.0.0.1:10086 --no-autoupdate > /tmp/cf.log 2>&1 &
          CF_PID=$!
          URL=""
          for i in $(seq 1 150); do
            if ! kill -0 "$CF_PID" 2>/dev/null; then
              echo "CLOUDFLARED DIED EARLY:"; cat /tmp/cf.log; exit 1
            fi
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log 2>/dev/null | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            echo "NO URL AFTER 150s - cf.log:"; cat /tmp/cf.log; exit 1
          fi
          HOST="${URL#https://}"
          VLESS="vless://$UUID@$HOST:443?encryption=none&security=tls&sni=$HOST&host=$HOST&type=ws&path=%2Fcfws#CF-US"
          {
            echo "### VLESS 节点链接（复制下面这行粘进 Hiddify）"
            echo ""
            echo '```'
            echo "$VLESS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=== VLESS LINK ==="
          echo "$VLESS"
          wait "$XRAY_PID" || true
          wait "$CF_PID" || true
